<text x="530" y="272" font-size="16" font-weight="400" fill="#57606a" text-anchor="start">fix dates, KEV, EPSS,</text>
<text x="530" y="293" font-size="16" font-weight="400" fill="#57606a" text-anchor="start">exploits, project health</text>
<rect x="796" y="220" width="224" height="104" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
<text x="810" y="248" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">5  Judge</text>
<text x="810" y="272" font-size="16" font-weight="400" fill="#57606a" text-anchor="start">release lag, likelihood,</text>
<text x="810" y="293" font-size="16" font-weight="400" fill="#57606a" text-anchor="start">your decisions</text>
<rect x="1076" y="220" width="224" height="104" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
