<text x="810" y="84" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">2  Scan</text>
<text x="810" y="108" font-size="16" font-weight="400" fill="#57606a" text-anchor="start">Trivy, Grype,</text>
<text x="810" y="129" font-size="16" font-weight="400" fill="#57606a" text-anchor="start">govulncheck, OSV</text>
