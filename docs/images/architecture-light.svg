<text x="1090" y="272" font-size="16" font-weight="400" fill="#57606a" text-anchor="start">--fail-on rules set</text>
<text x="1090" y="293" font-size="16" font-weight="400" fill="#57606a" text-anchor="start">the exit code</text>
