[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-intake"
version = "0.6.1"
description = "Assess third-party open source before adoption and on a schedule: vulnerabilities and malicious packages (Trivy, Grype, OSV), triage, new releases, release lag, project health and VEX."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ned Tavakol" }]
keywords = ["security", "sbom", "vulnerability", "trivy", "grype", "osv", "supply-chain", "vex", "openvex",
            "cyclonedx", "malicious-packages", "sca"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = ["requests>=2.31,<3"]

[project.urls]
Homepage = "https://github.com/ntavakol/OSS-Intake"
Documentation = "https://github.com/ntavakol/OSS-Intake#readme"
"Sample report" = "https://ntavakol.github.io/OSS-Intake/"
Source = "https://github.com/ntavakol/OSS-Intake"
Issues = "https://github.com/ntavakol/OSS-Intake/issues"
Changelog = "https://github.com/ntavakol/OSS-Intake/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
oss-intake = "oss_intake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oss_intake = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
