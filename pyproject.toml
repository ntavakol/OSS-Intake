[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-intake"
version = "0.20.0"
description = "Assess third-party open source before adoption and on a schedule: vulnerabilities and malicious packages (Trivy, Grype, OSV), triage, new releases, release lag, project health and VEX."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Ned Tavakol" }]
keywords = ["security", "sbom", "vulnerability", "trivy", "grype", "osv", "supply-chain", "vex", "openvex",
            "cyclonedx", "malicious-packages", "sca"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
# 2.33 is the first release without CVE-2024-35195, CVE-2024-47081 (.netrc credentials sent to the wrong host)
# and CVE-2026-25645; the hash-pinned requirements use a newer one.
dependencies = ["requests>=2.33,<3"]

[project.urls]
Homepage = "https://github.com/ntavakol/OSS-Intake"
Documentation = "https://github.com/ntavakol/OSS-Intake#readme"
"Sample report" = "https://ntavakol.github.io/OSS-Intake/"
Source = "https://github.com/ntavakol/OSS-Intake"
Issues = "https://github.com/ntavakol/OSS-Intake/issues"
Changelog = "https://github.com/ntavakol/OSS-Intake/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "coverage>=7", "mypy>=2.4", "openpyxl>=3.1", "cryptography>=42"]
xlsx = ["openpyxl>=3.1"]
# The PDF report; WeasyPrint also needs Pango from the system (not on PyPI), so it is not in dev.
pdf = ["weasyprint>=62"]
# Open VSX's Ed25519 signature on a .vsix, and the JetBrains Marketplace's signature on a plugin.
signatures = ["cryptography>=42"]

[project.scripts]
oss-intake = "oss_intake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oss_intake = ["data/*.json", "data/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rs"  # -rs: name each skipped test and why, so CI shows what did not run

[tool.coverage.run]
source = ["oss_intake"]

[tool.coverage.report]
# CI fails below this total (line coverage; 91% when the floor was set, Nov 2026). Raise it as coverage grows;
# lower it only with a reason in the commit message.
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
# Default (not strict) checking of src/, blocking in CI. Python 3.10 is the oldest supported version.
files = ["src/oss_intake"]
python_version = "3.10"
warn_unused_ignores = true
# Bodies of functions without annotations are not checked (the default); this only hides the note saying so.
disable_error_code = ["annotation-unchecked"]

[[tool.mypy.overrides]]
# openpyxl (the optional .xlsx reader) ships no type hints; WeasyPrint (the optional PDF) is not installed in CI.
module = ["openpyxl", "openpyxl.*", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
