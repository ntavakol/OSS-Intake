{
  "queries": {
    "oss_intake_os_version": {
      "query": "SELECT name, version, major, minor, platform, platform_like, codename FROM os_version;",
      "interval": 86400,
      "snapshot": true,
      "description": "oss-intake: installed packages for examples/osquery/osquery_sbom.py"
    },
    "oss_intake_deb_packages": {
      "query": "SELECT name, version, source, arch, status FROM deb_packages;",
      "interval": 86400,
      "snapshot": true,
      "platform": "linux",
      "description": "oss-intake: installed packages for examples/osquery/osquery_sbom.py"
    },
    "oss_intake_rpm_packages": {
      "query": "SELECT name, version, release, epoch, arch, source FROM rpm_packages;",
      "interval": 86400,
      "snapshot": true,
      "platform": "linux",
      "description": "oss-intake: installed packages for examples/osquery/osquery_sbom.py"
    },
    "oss_intake_python_packages": {
      "query": "SELECT p.name, p.version, p.directory FROM users CROSS JOIN python_packages p USING (uid);",
      "interval": 86400,
      "snapshot": true,
      "description": "oss-intake: installed packages for examples/osquery/osquery_sbom.py (every user's default locations)"
    },
    "oss_intake_npm_packages": {
      "query": "SELECT name, version, directory FROM npm_packages;",
      "interval": 86400,
      "snapshot": true,
      "description": "oss-intake: installed packages for examples/osquery/osquery_sbom.py (global node_modules only)"
    },
    "oss_intake_homebrew_packages": {
      "query": "SELECT name, version, type FROM homebrew_packages;",
      "interval": 86400,
      "snapshot": true,
      "platform": "darwin",
      "description": "oss-intake: installed packages for examples/osquery/osquery_sbom.py"
    },
    "oss_intake_chocolatey_packages": {
      "query": "SELECT name, version FROM chocolatey_packages;",
      "interval": 86400,
      "snapshot": true,
      "platform": "windows",
      "description": "oss-intake: installed packages for examples/osquery/osquery_sbom.py"
    }
  }
}
