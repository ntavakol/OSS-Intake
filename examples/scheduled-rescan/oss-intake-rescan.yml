# Re-scan the organisation's open source inventory every week.
#
# A package that was clean when it was approved can later turn out vulnerable or compromised, so the inventory is
# checked again on a schedule. Copy this file to .github/workflows/ in the repository that holds the inventory:
#
#   inventory.csv                    ecosystem,name,version (+ any label columns: owner, system...), or set
#                                    INVENTORY below to an SBOM file or a folder of SBOMs (see examples/sbom)
#   oss-intake/findings.csv          the assessor's decisions (optional; the previous run's findings.csv with the
#                                    triage columns filled in)
#
# Each run writes the reports as a build artifact, carries the decisions forward, and opens an issue when there are
# new Act now findings (malicious, known exploited, or a ready-to-use exploit) or new releases under a week old.
# The workflow never commits: download findings.csv from the artifact, record decisions, and commit it yourself.
#
# Least privilege: read the repository, open issues; nothing else. Actions are pinned by commit SHA (update them
# with Dependabot once the file is under .github/workflows). oss-intake is pinned by version; to pin it by hash as
# well, keep a requirements file made with `uv pip compile --generate-hashes` and install with --require-hashes.
name: oss-intake re-scan

on:
  schedule:
    - cron: "17 21 * * 0"   # Sundays 21:17 UTC (Monday morning in Australia)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  INVENTORY: inventory.csv   # or a CycloneDX/SPDX file, or a folder of them

concurrency:
  group: oss-intake-rescan
  cancel-in-progress: false

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install oss-intake (pinned)
        run: python -m pip install "oss-intake==0.11.0"
      - name: Scan the inventory
        id: scan
        run: |
          decisions=()
          if [ -f oss-intake/findings.csv ]; then decisions=(--decisions oss-intake/findings.csv); fi
          set +e
          oss-intake --path "$INVENTORY" --out reports "${decisions[@]}" --fail-on act,malicious,recent --quiet
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          # 0 clean, 3 something to act on; anything else is a failed run and fails the job.
          if [ "$code" != 0 ] && [ "$code" != 3 ]; then exit "$code"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()  # a failed run still leaves its reports and logs to look at
        with:
          name: oss-intake-reports
          path: reports/
          retention-days: 90
      - name: Open an issue when something to act on has not been reported yet
        if: steps.scan.outputs.exit == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # What needs action: Act now findings that no decision has set aside (malicious packages always), and
          # releases under a week old. The same set is reported once: the issue title carries a fingerprint of
          # it, and an open issue with that fingerprint means it is already known. A change opens a new issue.
          jq -r '[.findings[] | select(.suggested_group == "Act now") | "\(.id) \(.package) \(.installed)"]
                 + [.release_age.recent[]? | "new \(.package) \(.version)"] | unique | .[]' \
            reports/assessment.json > items.txt
          [ -s items.txt ] || exit 0
          fingerprint=$(sha256sum items.txt | cut -c1-12)
          if gh issue list --state open --search "${fingerprint} in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "Already reported in an open issue (${fingerprint})"; exit 0
          fi
          {
            echo "The weekly re-scan of ${INVENTORY} found something to act on:"
            echo
            sed 's/^/- /' items.txt
            echo
            echo "Reports (executive-summary.html, report.html, packages.csv, findings.csv): ${RUN_URL}"
            echo
            echo "Record decisions in findings.csv from the artifact and commit it as oss-intake/findings.csv;"
            echo "findings set aside there drop out of the next run (malicious packages never do: remove them)."
          } > body.md
          gh issue create --title "oss-intake: $(wc -l < items.txt) item(s) to act on [${fingerprint}]" --body-file body.md
