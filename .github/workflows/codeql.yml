name: codeql

# Static analysis of oss-intake's own code (Scorecard's SAST check). Results appear under
# Security > Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: codeql (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload code scanning results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
