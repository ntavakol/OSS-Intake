name: pages

# Publishes site/ (the landing page, the sample report and the command builder) to GitHub Pages, from a
# release tag: the builder's option list (site/builder/options.json) must match the version on PyPI, so the
# site changes when a release is published, not on every push to main. Run it by hand with a tag to republish.
# The sample report is rebuilt and committed before the release is tagged (examples/compromised-npm/build.sh),
# so this workflow runs no scanner.
#
# It also publishes the release's known-bad scanner list (src/oss_intake/data/known_bad.json) at known-bad/,
# signed with Sigstore by this workflow (keyless); known-bad.yml republishes it when the list changes on main.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.21.0"
        required: true

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: publish site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A pre-release does not publish the site; the builder follows the release on PyPI.
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read
      pages: write # deploy to GitHub Pages
      id-token: write # verify the deployment's origin, and sign the known-bad list (Sigstore, keyless)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check the tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then echo "not a release tag: $TAG"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: The builder's options match the release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('site/builder/options.json'))['version'])")
          if [ "v$version" != "$TAG" ]; then echo "site/builder/options.json is for $version, not $TAG"; exit 1; fi
      - name: The known-bad list, to sign (main's when it is newer than the release's, so nothing added since is lost)
        run: |
          mkdir -p site/known-bad
          cp src/oss_intake/data/known_bad.json site/known-bad/known_bad.json
          git fetch --quiet --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" main
          git show FETCH_HEAD:src/oss_intake/data/known_bad.json > main-known-bad.json
          python3 -I -c "import json, shutil; a, b = (json.load(open(f)) for f in ('site/known-bad/known_bad.json', 'main-known-bad.json')); b['updated'] > a['updated'] and shutil.copy('main-known-bad.json', 'site/known-bad/known_bad.json')"
          python3 -I -c "import json, sys; sys.path.insert(0, 'src'); from oss_intake import integrity as i; v = getattr(i, '_valid_known_bad', None); ok = v is None or v(json.load(open('site/known-bad/known_bad.json'))); sys.exit(0 if ok else 'the known-bad list is not in the expected form')"
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./site/known-bad/known_bad.json
          release-signing-artifacts: false # the job cannot write to the release, and nothing needs it there
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
