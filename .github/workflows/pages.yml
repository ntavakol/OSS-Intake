name: pages

# Publishes site/ (the landing page, the sample report and the command builder) to GitHub Pages, from a
# release tag: the builder's option list (site/builder/options.json) must match the version on PyPI, so the
# site changes when a release is published, not on every push to main. Run it by hand with a tag to republish.
# The sample report is rebuilt and committed before the release is tagged (examples/compromised-npm/build.sh),
# so this workflow runs no scanner.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.19.0"
        required: true

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: publish site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A pre-release does not publish the site; the builder follows the release on PyPI.
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: read
      pages: write # deploy to GitHub Pages
      id-token: write # verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check the tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then echo "not a release tag: $TAG"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: The builder's options match the release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('site/builder/options.json'))['version'])")
          if [ "v$version" != "$TAG" ]; then echo "site/builder/options.json is for $version, not $TAG"; exit 1; fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
