name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository. No job needs a write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:  # the versions in between, on one OS
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      # Third-party actions are pinned by full commit SHA. Tags are mutable; in March 2026
      # attackers force-pushed 76 of 77 aquasecurity/trivy-action tags to malicious commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (hash-pinned)
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.13') }}
        run: python -m pytest
      # One job measures coverage: the same tests, with a floor (pyproject.toml, [tool.coverage.report]).
      - name: Test with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.13' }}
        run: |
          python -m coverage run -m pytest
          python -m coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report  # enforces fail_under from pyproject.toml

  release-sbom:
    # The release workflow's build and SBOM steps on every push, so a broken SBOM shows up before a release.
    name: release SBOM (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build (hash-pinned tools)
        run: |
          python -m pip install --require-hashes -r requirements/build.txt
          python -m build --no-isolation
      - name: SBOM, read back by oss-intake
        run: |
          env="$RUNNER_TEMP/sbom-env"
          python -m venv "$env"
          "$env/bin/python" -m pip install --require-hashes -r requirements/runtime.txt
          "$env/bin/python" -m pip install --no-deps dist/*.whl
          "$env/bin/python" -I scripts/release_sbom.py --wheel dist/*.whl --out sbom/oss-intake.cdx.json
          "$env/bin/python" -I -c "from pathlib import Path; from oss_intake import sbom; \
          entries, _, _ = sbom.read(Path('sbom')); assert any(e['purl'].startswith('pkg:pypi/requests@') \
          for e in entries), entries; print(len(entries), 'packages read back by oss-intake')"

  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned by version and SHA-256 of the release archive, like the scanners oss-intake verifies.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not just the latest
          persist-credentials: false
      - name: Install gitleaks (verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        # Accepted findings are listed, each with its reason, in .gitleaksignore; anything else fails the job.
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1'
