name: Feature request
description: A check, input or output oss-intake should have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to assess or decide, and where oss-intake falls short today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The behaviour, flag or output you have in mind, and any data source it would need
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you use instead today
    validations:
      required: false
